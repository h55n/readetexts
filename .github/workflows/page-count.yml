name: Page-count markup regression
on:
  push:
    branches: [verify/page-count-markup-24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install real Sugar and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-sugar3 python3-gi python3-cairo gir1.2-gtk-3.0 python3-flake8 gir1.2-telepathyglib-0.12 python3-dbus gir1.2-soup-2.4 xvfb dbus-x11
      - name: Compile, lint tests and check whitespace
        run: |
          /usr/bin/python3 -m py_compile ReadEtextsActivity.py readtoolbar.py tests/test_page_count.py
          /usr/bin/python3 -m flake8 tests
          git -c core.whitespace=cr-at-eol diff --check 098ad3369d36897cac7c86dd47bcc90024a0c3a3
      - name: Check for new source lint findings against upstream baseline
        run: |
          mkdir /tmp/import-baseline
          git show 098ad3369d36897cac7c86dd47bcc90024a0c3a3:ReadEtextsActivity.py > /tmp/import-baseline/ReadEtextsActivity.py
          git show 098ad3369d36897cac7c86dd47bcc90024a0c3a3:readtoolbar.py > /tmp/import-baseline/readtoolbar.py
          python3 - <<'PY'
          import subprocess
          def findings(paths):
              run = subprocess.run(['/usr/bin/python3', '-m', 'flake8', *paths], capture_output=True, text=True)
              assert run.returncode in (0, 1), run.stderr
              return sorted(':'.join(line.split(':')[3:]).strip() for line in run.stdout.splitlines())
          baseline = findings(['/tmp/import-baseline/ReadEtextsActivity.py', '/tmp/import-baseline/readtoolbar.py'])
          current = findings(['ReadEtextsActivity.py', 'readtoolbar.py'])
          print('Existing source lint findings:', baseline)
          assert current == baseline, (baseline, current)
          PY
      - name: Run page-count regressions
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build activity bundle
        run: /usr/bin/python3 setup.py dist_xo
